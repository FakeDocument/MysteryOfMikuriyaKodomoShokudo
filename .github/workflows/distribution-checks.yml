name: Validate setup distribution
on:
  pull_request:
    paths: ['distribution/**', 'scripts/**', 'tests/**', 'site/**', 'README.md', '.github/workflows/**']
  push:
    branches: ['**']
    paths: ['distribution/**', 'scripts/**', 'tests/**', 'site/**', 'README.md', '.github/workflows/**']
permissions:
  contents: read
jobs:
  package-and-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: bash -n distribution/start.command launcher/start.command
      - run: pip install -r site/requirements.txt
      - run: python scripts/build_site.py
  windows-syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5 launcher syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $source = Get-Content -Raw -Encoding UTF8 distribution/start.ps1
          [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
