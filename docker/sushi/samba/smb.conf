[global]
    workgroup = WORKGROUP
    server string = Mikuriya Suisan File Server
    server role = standalone server
    security = user
    map to guest = never
    server min protocol = SMB2_02
    disable netbios = yes
    log level = 1
    log file = /var/log/samba/log.%m
    max log size = 1000
    smb ports = 445
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    usershare allow guests = no

[staff]
    comment = 御厨水産 スタッフ共有
    path = /srv/samba/staff
    browseable = yes
    read only = yes
    guest ok = no
    valid users = kanzaki
    follow symlinks = no
    wide links = no
