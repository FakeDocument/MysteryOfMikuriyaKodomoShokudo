[global]
    workgroup = WORKGROUP
    server string = Kaiiki Records File Server
    server role = standalone server
    security = user
    map to guest = Bad User
    server min protocol = SMB2_02
    disable netbios = yes
    log level = 1
    log file = /var/log/samba/log.%m
    max log size = 1000
    smb ports = 445
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    usershare allow guests = no

[handover]
    comment = 庁内引継資料
    path = /srv/samba/handover
    browseable = yes
    read only = yes
    guest ok = yes
    follow symlinks = no
    wide links = no

[handoff]
    comment = 輸送原簿
    path = /srv/samba/handoff
    browseable = yes
    read only = yes
    guest ok = no
    valid users = hozen_sync
    follow symlinks = no
    wide links = no
