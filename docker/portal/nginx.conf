server {
    listen 80 default_server;
    server_name kaiiki-hozen.local;

    # 庁内目録のPOSTルートを公開サイトの列挙結果へ混ぜない。
    location = /login { return 404; }
    location = /logout { return 404; }
    location = /search { return 404; }
    location ^~ /documents/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Kaiiki-Service public;
    }
}

server {
    listen 8080;
    server_name kaiiki-hozen.local;

    location = /archive { return 404; }
    location ^~ /archive/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Kaiiki-Service catalog;
    }
}
